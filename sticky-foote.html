<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,body{
            margin:0;
            height:100%;
        }
        .body{
            display:flex;
            flex-direction:column;
        }
        header{
            background:lightgray;
            height:60px;
        }
        footer{
            background:lightgray;
            height:60px;
            margin-top:auto;
            flex:none;
        }
        main{
            display:flex;
            flex:1 0;
        }
        article{
            flex:1 1;
        }

        aside{
            width:250px;
            flex:none;
            background-color:lightblue;
        }
    </style>
</head>
<body>
    <header>header</header>
    <main>
        <article>article</article>
        <div style="height:250px;"></div>
        <aside>sidebar</aside>
    </main>
    <footer>footer</footer>
</body>
</html>
